<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Betterolly Photo — Creative Studio</title>
<style>
:root{--bg:#f7f8fa;--panel:#fff;--line:#e3e6eb;--text:#172033;--muted:#697386;--blue:#4f46e5;--blue2:#eef2ff;--dark:#202533;--shadow:0 8px 30px #17203312}
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select{font:inherit}.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:8px}.brand{font-size:18px;font-weight:800;letter-spacing:-.5px;margin-right:10px;color:#111827}.brand b{color:var(--blue)}.menu{display:flex;gap:2px}.btn{border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer}.btn:hover{background:#f0f2f6;color:var(--text)}.btn.primary{background:var(--blue);color:#fff}.btn.icon{font-size:17px;padding:8px}.spacer{flex:1}.workspace{height:calc(100% - 84px);display:flex}.left{width:62px;background:#fff;border-right:1px solid var(--line);padding:9px 7px;display:flex;flex-direction:column;gap:5px}.tool{width:48px;height:42px;border:0;background:transparent;border-radius:9px;color:#667085;cursor:pointer;font-size:18px}.tool small{display:block;font-size:8px;margin-top:2px}.tool:hover,.tool.active{background:var(--blue2);color:var(--blue)}.center{flex:1;min-width:0;display:flex;flex-direction:column}.options{height:48px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:10px}.optionlabel{font-size:12px;color:var(--muted)}.stage-wrap{flex:1;position:relative;overflow:hidden;background:#e9ecf1;display:flex;align-items:center;justify-content:center}.checker{position:absolute;width:var(--w);height:var(--h);background-color:#fff;background-image:linear-gradient(45deg,#edf0f4 25%,transparent 25%),linear-gradient(-45deg,#edf0f4 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#edf0f4 75%),linear-gradient(-45deg,transparent 75%,#edf0f4 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;box-shadow:0 16px 50px #17203330;transform-origin:center}.checker canvas{position:absolute;inset:0}.right{width:310px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column}.tabs{display:flex;border-bottom:1px solid var(--line)}.tab{flex:1;padding:13px 5px;border:0;background:#fff;color:var(--muted);font-size:12px;cursor:pointer}.tab.active{color:var(--blue);font-weight:700;border-bottom:2px solid var(--blue)}.panel{display:none;overflow:auto;padding:14px}.panel.active{display:block}.section{margin-bottom:20px}.title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8a93a3;font-weight:800;margin-bottom:9px}.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row label{font-size:12px;color:var(--muted);width:76px}.row input[type=range]{flex:1}.num{width:62px;border:1px solid var(--line);border-radius:6px;padding:6px;background:#fff}.select{flex:1;border:1px solid var(--line);border-radius:6px;padding:6px;background:#fff}.layer{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer}.layer.active{border-color:#a5b4fc;background:#f5f7ff}.thumb{width:38px;height:30px;background:#f1f3f6;border-radius:5px;object-fit:cover}.lname{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.eye{border:0;background:transparent;cursor:pointer;color:#687386}.footer{height:28px;border-top:1px solid var(--line);background:#fff;display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--muted);gap:20px}.drop{border:1px dashed #b8c0ce;border-radius:10px;padding:22px;text-align:center;color:var(--muted);margin-bottom:12px}.hidden{display:none}.color{width:32px;height:28px;border:1px solid var(--line);padding:2px;background:white}.danger{color:#c24141}.mini{font-size:11px;padding:5px 7px}.history{font-size:11px;color:var(--muted);padding:5px 0}
</style>
</head>
<body>
<div id="app">
<header class="top">
 <div class="brand">Betterolly <b>Photo</b></div>
 <div class="menu">
  <button class="btn" id="new">New</button><button class="btn" id="open">Open</button>
  <button class="btn" id="save">Export</button>
 </div>
 <div class="spacer"></div>
 <button class="btn icon" id="undo" title="Undo Ctrl+Z">↶</button><button class="btn icon" id="redo" title="Redo Ctrl+Shift+Z">↷</button>
 <button class="btn" id="fit">Fit</button><button class="btn primary" id="export">Download PNG</button>
</header>
<div class="workspace">
 <aside class="left" id="tools"></aside>
 <main class="center">
  <div class="options" id="options"></div>
  <div class="stage-wrap" id="viewport"><div class="checker" id="stage"><canvas id="canvas"></canvas><canvas id="overlay"></canvas></div></div>
 </main>
 <aside class="right">
  <div class="tabs"><button class="tab active" data-p="layers">Layers</button><button class="tab" data-p="design">Design</button><button class="tab" data-p="adjust">Adjust</button></div>
  <div class="panel active" id="layers"><div class="section"><div class="title">Layers</div><button class="btn primary" style="width:100%" id="addLayer">＋ New layer</button><div id="layerList"></div></div><div class="section"><div class="title">Layer</div><div class="row"><label>Opacity</label><input id="opacity" type="range" min="0" max="100" value="100"><span id="opacityV">100%</span></div><div class="row"><label>Blend</label><select id="blend" class="select"><option>source-over</option><option>multiply</option><option>screen</option><option>overlay</option><option>darken</option><option>lighten</option><option>color-dodge</option><option>difference</option></select></div><button class="btn danger mini" id="deleteLayer">Delete layer</button></div></div>
  <div class="panel" id="design"><div class="section"><div class="title">Shapes</div><div class="row"><button class="btn" id="rect">Rectangle</button><button class="btn" id="circle">Circle</button></div><div class="row"><label>Fill</label><input class="color" id="fill" type="color" value="#4f46e5"></div><div class="row"><label>Stroke</label><input class="color" id="stroke" type="color" value="#172033"></div></div><div class="section"><div class="title">Typography</div><div class="row"><input id="textInput" class="select" placeholder="Type something..."></div><div class="row"><label>Size</label><input id="fontSize" class="num" type="number" value="48" min="8" max="300"></div><button class="btn primary" style="width:100%" id="addText">Add text</button></div></div>
  <div class="panel" id="adjust"><div class="section"><div class="title">Image adjustments</div><div class="row"><label>Brightness</label><input id="brightness" type="range" min="-100" max="100" value="0"></div><div class="row"><label>Contrast</label><input id="contrast" type="range" min="-100" max="100" value="0"></div><div class="row"><label>Saturation</label><input id="saturation" type="range" min="-100" max="100" value="0"></div><button class="btn primary" style="width:100%" id="applyAdjust">Apply adjustments</button></div><div class="section"><div class="title">Filters</div><div class="row"><button class="btn" id="gray">Grayscale</button><button class="btn" id="invert">Invert</button><button class="btn" id="sepia">Sepia</button></div><button class="btn" style="width:100%" id="removeBg">Remove simple background</button></div></div>
 </aside>
</div>
<footer class="footer"><span id="toolStatus">Tool: Move</span><span id="coord">X: 0 Y: 0</span><span id="zoom">100%</span><span id="size">1200 × 800</span><span class="spacer"></span><span>Betterolly Photo • Creative Studio</span></footer>
<input id="file" class="hidden" type="file" accept="image/*" multiple>
</div>
<script>
const $=id=>document.getElementById(id), canvas=$('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true}), overlay=$('overlay'), octx=overlay.getContext('2d');
const icons={move:'✥',brush:'✎',eraser:'⌫',select:'▧',crop:'⌗',text:'T',rect:'□',circle:'○',eyedrop:'◉'};
let tool='move',layers=[],active=null,zoom=1,selection=null,drawing=false,start=null,history=[],hi=-1;
function resize(w=1200,h=800){canvas.width=overlay.width=w;canvas.height=overlay.height=h;$('stage').style.setProperty('--w',w+'px');$('stage').style.setProperty('--h',h+'px');$('size').textContent=w+' × '+h;dirty();}
function layer(name='Layer '+(layers.length+1),white=false){const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;const x=c.getContext('2d');if(white){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)};const l={id:crypto.randomUUID(),name,canvas:c,ctx:x,x:0,y:0,opacity:1,blend:'source-over',visible:true};layers.unshift(l);active=l;renderLayers();dirty();return l}
function renderLayers(){const list=$('layerList');list.innerHTML='';layers.forEach(l=>{const row=document.createElement('div');row.className='layer '+(l===active?'active':'');const t=document.createElement('canvas');t.width=76;t.height=60;t.className='thumb';t.getContext('2d').drawImage(l.canvas,0,0,76,60);const n=document.createElement('div');n.className='lname';n.textContent=l.name;const e=document.createElement('button');e.className='eye';e.textContent=l.visible?'◉':'○';e.onclick=ev=>{ev.stopPropagation();l.visible=!l.visible;renderLayers();dirty()};row.append(t,n,e);row.onclick=()=>{active=l;renderLayers();syncLayer()};list.append(row)})}
function syncLayer(){if(!active)return;$('opacity').value=active.opacity*100;$('opacityV').textContent=Math.round(active.opacity*100)+'%';$('blend').value=active.blend}
function render(){ctx.clearRect(0,0,canvas.width,canvas.height);[...layers].reverse().forEach(l=>{if(!l.visible)return;ctx.save();ctx.globalAlpha=l.opacity;ctx.globalCompositeOperation=l.blend;ctx.drawImage(l.canvas,l.x,l.y);ctx.restore()})}
let dirtyFlag=true;function dirty(){dirtyFlag=true}function frame(){if(dirtyFlag){render();dirtyFlag=false}requestAnimationFrame(frame)}requestAnimationFrame(frame);
function setZoom(z){zoom=Math.max(.1,Math.min(8,z));$('stage').style.transform='scale('+zoom+')';$('zoom').textContent=Math.round(zoom*100)+'%'}
function fit(){setZoom(Math.min(($('viewport').clientWidth-80)/canvas.width,($('viewport').clientHeight-80)/canvas.height))}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function paint(p){if(!active)return;const x=p.x-active.x,y=p.y-active.y;active.ctx.save();active.ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';active.ctx.fillStyle=$('fill').value;active.ctx.beginPath();active.ctx.arc(x,y,Number(sizeInput.value),0,Math.PI*2);active.ctx.fill();active.ctx.restore();dirty()}
const sizeInput=document.createElement('input');sizeInput.type='range';sizeInput.min=1;sizeInput.max=200;sizeInput.value=24;
function buildTools(){const t=$('tools');Object.entries(icons).forEach(([k,v])=>{const b=document.createElement('button');b.className='tool '+(k==='move'?'active':'');b.innerHTML=v+'<small>'+k+'</small>';b.onclick=()=>{tool=k;document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('toolStatus').textContent='Tool: '+k[0].toUpperCase()+k.slice(1);buildOptions()};t.append(b)})}
function buildOptions(){const o=$('options');o.innerHTML='';if(tool==='brush'||tool==='eraser'){o.innerHTML='<span class="optionlabel">Brush size</span>';o.append(sizeInput)}else if(tool==='text'){o.innerHTML='<span class="optionlabel">Text tool — add text from Design</span>'}else{o.innerHTML='<span class="optionlabel">'+tool[0].toUpperCase()+tool.slice(1)+' tool</span>'}}
function snapshot(label){const s={label,w:canvas.width,h:canvas.height,layers:layers.map(l=>({name:l.name,x:l.x,y:l.y,opacity:l.opacity,blend:l.blend,visible:l.visible,data:l.canvas.toDataURL()}))};history=history.slice(0,hi+1);history.push(s);hi++;if(history.length>30){history.shift();hi--}}
function restore(s){resize(s.w,s.h);layers=[];s.layers.forEach(d=>{const l=layer(d.name);l.x=d.x;l.y=d.y;l.opacity=d.opacity;l.blend=d.blend;l.visible=d.visible;const img=new Image();img.onload=()=>{l.ctx.clearRect(0,0,l.canvas.width,l.canvas.height);l.ctx.drawImage(img,0,0);dirty();renderLayers()};img.src=d.data});active=layers[0];renderLayers()}
function undo(){if(hi>0){hi--;restore(history[hi])}}function redo(){if(hi<history.length-1){hi++;restore(history[hi])}}
function addText(){const txt=$('textInput').value.trim();if(!txt)return;const l=layer('Text — '+txt.slice(0,18));l.ctx.font='700 '+Number($('fontSize').value)+'px Inter, Arial';l.ctx.fillStyle=$('fill').value;l.ctx.fillText(txt,80,140);snapshot('Add text');renderLayers();dirty()}
function shape(type){const l=layer(type==='rect'?'Rectangle':'Circle');const x=l.ctx;x.fillStyle=$('fill').value;x.strokeStyle=$('stroke').value;x.lineWidth=5;if(type==='rect'){x.roundRect(180,150,520,320,24);x.fill();x.stroke()}else{x.beginPath();x.arc(440,310,160,0,Math.PI*2);x.fill();x.stroke()}snapshot('Shape');renderLayers();dirty()}
function adjust(mode){if(!active)return;const d=active.ctx.getImageData(0,0,active.canvas.width,active.canvas.height),a=d.data;b:for(let i=0;i<a.length;i+=4){if(mode==='gray'){const v=.2126*a[i]+.7152*a[i+1]+.0722*a[i+2];a[i]=a[i+1]=a[i+2]=v}else if(mode==='invert'){a[i]=255-a[i];a[i+1]=255-a[i+1];a[i+2]=255-a[i+2]}else if(mode==='sepia'){let r=a[i],g=a[i+1],b=a[i+2];a[i]=Math.min(255,r*.393+g*.769+b*.189);a[i+1]=Math.min(255,r*.349+g*.686+b*.168);a[i+2]=Math.min(255,r*.272+g*.534+b*.131)}}active.ctx.putImageData(d,0,0);snapshot(mode);renderLayers();dirty()}
$('new').onclick=()=>{resize();layers=[];layer('Background',true);snapshot('New');renderLayers();fit()};$('open').onclick=()=>$('file').click();$('addLayer').onclick=()=>{layer();snapshot('Layer')};$('undo').onclick=undo;$('redo').onclick=redo;$('fit').onclick=fit;$('export').onclick=()=>{const a=document.createElement('a');a.download='betterolly-photo.png';a.href=canvas.toDataURL('image/png');a.click()};$('save').onclick=$('export').onclick;
$('file').onchange=e=>Array.from(e.target.files).forEach(file=>{const img=new Image();img.onload=()=>{const l=layer(file.name);l.ctx.clearRect(0,0,l.canvas.width,l.canvas.height);const scale=Math.min(l.canvas.width/img.width,l.canvas.height/img.height,1);const w=img.width*scale,h=img.height*scale;l.ctx.drawImage(img,(l.canvas.width-w)/2,(l.canvas.height-h)/2,w,h);snapshot('Import');renderLayers();dirty()};img.src=URL.createObjectURL(file)});e.target.value='';
$('opacity').oninput=e=>{if(active){active.opacity=e.target.value/100;$('opacityV').textContent=e.target.value+'%';dirty()}};$('blend').onchange=e=>{if(active){active.blend=e.target.value;dirty()}};$('deleteLayer').onclick=()=>{if(!active||layers.length<2)return;layers=layers.filter(l=>l!==active);active=layers[0];renderLayers();syncLayer();snapshot('Delete');dirty()};
$('addText').onclick=addText;$('rect').onclick=()=>shape('rect');$('circle').onclick=()=>shape('circle');$('gray').onclick=()=>adjust('gray');$('invert').onclick=()=>adjust('invert');$('sepia').onclick=()=>adjust('sepia');
$('applyAdjust').onclick=()=>{if(!active)return;const br=+$('brightness').value,co=+$('contrast').value,sa=+$('saturation').value;const d=active.ctx.getImageData(0,0,active.canvas.width,active.canvas.height),a=d.data,cf=(259*(co+255))/(255*(259-co));for(let i=0;i<a.length;i+=4){let r=a[i],g=a[i+1],b=a[i+2];r=cf*(r-128)+128+br;g=cf*(g-128)+128+br;b=cf*(b-128)+128+br;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),avg=(r+g+b)/3,f=1+sa/100;r=avg+(r-avg)*f;g=avg+(g-avg)*f;b=avg+(b-avg)*f;a[i]=Math.max(0,Math.min(255,r));a[i+1]=Math.max(0,Math.min(255,g));a[i+2]=Math.max(0,Math.min(255,b))}active.ctx.putImageData(d,0,0);snapshot('Adjustments');renderLayers();dirty()};
$('removeBg').onclick=()=>{if(!active)return;const d=active.ctx.getImageData(0,0,active.canvas.width,active.canvas.height),a=d.data,r=[a[0],a[1],a[2]];for(let i=0;i<a.length;i+=4){if(Math.abs(a[i]-r[0])+Math.abs(a[i+1]-r[1])+Math.abs(a[i+2]-r[2])<55)a[i+3]=0}active.ctx.putImageData(d,0,0);snapshot('Remove background');dirty()};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');$(t.dataset.p).classList.add('active')});
canvas.onmousedown=e=>{drawing=true;start=pos(e);if(tool==='brush'||tool==='eraser')paint(start);if(tool==='select'||tool==='crop'){selection={...start,w:0,h:0}}};
window.onmousemove=e=>{const p=pos(e);$('coord').textContent='X: '+Math.round(p.x)+' Y: '+Math.round(p.y);if(!drawing)return;if(tool==='move'&&active){active.x+=(p.x-start.x);active.y+=(p.y-start.y);start=p;dirty()}else if(tool==='brush'||tool==='eraser')paint(p);else if((tool==='select'||tool==='crop')&&selection){selection.w=p.x-selection.x;selection.h=p.y-selection.y;octx.clearRect(0,0,overlay.width,overlay.height);octx.strokeStyle='#4f46e5';octx.setLineDash([7,5]);octx.strokeRect(selection.x,selection.y,selection.w,selection.h)}};
window.onmouseup=()=>{if(drawing)snapshot(tool);drawing=false;if(tool==='crop'&&selection){const r={x:Math.min(selection.x,selection.x+selection.w),y:Math.min(selection.y,selection.y+selection.h),w:Math.abs(selection.w),h:Math.abs(selection.h)};if(r.w>10&&r.h>10){layers.forEach(l=>{const c=document.createElement('canvas');c.width=r.w;c.height=r.h;c.getContext('2d').drawImage(l.canvas,r.x,r.y,r.w,r.h,0,0,r.w,r.h);l.canvas=c;l.ctx=c.getContext('2d')});resize(r.w,r.h);snapshot('Crop')}selection=null;octx.clearRect(0,0,overlay.width,overlay.height);renderLayers();dirty()}};
$('viewport').onwheel=e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:.9))}};
window.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}if(e.key==='v')tool='move';if(e.key==='b')tool='brush';if(e.key==='e')tool='eraser';if(e.key==='t')tool='text'};
buildTools();buildOptions();resize();layer('Background',true);snapshot('Initial');renderLayers();syncLayer();fit();
</script>
</body></html>
